[package]
name = "laptopkbd"
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Galaxy Tab S7 FE: the tablet screen as a laptop keyboard + trackpad while an external monitor is connected (niri)"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
evdev = "0.13"
niri-ipc = "=26.4.0"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
