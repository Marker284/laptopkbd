[package]
name = "laptopkbd-settings"
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Settings window for laptopkbd"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "display"] }
libc = "0.2"
